<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixTrace</title>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--card:#fff;--tx:#17212b;--mu:#73808d;--bd:#e7ebef;--ac:#176b57;--ac-dark:#105443;--ok:#13805d;--bad:#c04c43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:1120px;margin:0 auto;padding:38px 28px 56px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:30px}
h1{font-size:25px;letter-spacing:-.7px;margin:0;font-weight:750}h1 span{color:var(--ac)}
h2{font-size:18px;letter-spacing:-.3px;margin:0}
.sub{color:var(--mu);font-size:13px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--ac);color:white;font-size:23px;box-shadow:0 6px 14px #176b572b}
.eyebrow{font-size:11px;letter-spacing:1.35px;text-transform:uppercase;color:var(--mu);font-weight:700;margin-bottom:5px}
.intro{margin:0 0 22px}
.intro h2{font-size:26px;letter-spacing:-.8px;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:18px;box-shadow:0 3px 12px #17212b08}
.stat{position:relative;min-height:112px;overflow:hidden}
.stat:after{content:"";position:absolute;right:-20px;bottom:-32px;width:86px;height:86px;border-radius:50%;background:#176b5709}
.stat-label{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:12px;font-weight:600}
.stat-icon{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:9px;background:#edf5f2;color:var(--ac);font-size:14px}
.stat b{display:block;font-size:23px;letter-spacing:-.6px;margin-top:11px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:650;cursor:pointer;transition:background .16s,transform .16s,box-shadow .16s}
button:hover{background:var(--ac-dark);box-shadow:0 4px 12px #176b572b;transform:translateY(-1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #176b5733;outline-offset:2px}
button.ghost{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.ghost:hover{border-color:#b9cbc5;color:var(--ac);background:#f8fbf9}
button.sm{padding:5px 10px;font-size:13px}
input,select{background:#fbfcfc;border:1px solid var(--bd);border-radius:9px;padding:10px 11px;width:100%;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:#72a795;box-shadow:0 0 0 3px #176b5712;outline:0}
label{display:block;font-size:12px;color:#52616c;font-weight:650;margin-bottom:5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin:16px 0}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.dev{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer;margin-bottom:10px;padding:17px 19px;transition:border-color .16s,transform .16s,box-shadow .16s}
.dev:hover{border-color:#a8c9bd;transform:translateY(-2px);box-shadow:0 8px 20px #17212b0b}
.dev-title{display:flex;align-items:center;gap:12px}
.device-icon{display:grid;place-items:center;flex:0 0 42px;height:42px;border-radius:12px;background:#edf5f2;color:var(--ac);font-size:19px}
.dev-name{font-weight:700;font-size:15px}
.dev-value{font-size:16px;font-weight:750;letter-spacing:-.3px;margin-top:5px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#f1f4f5;color:#596873;font-weight:650}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.count{color:var(--mu);font-size:12px;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.55px}
tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:45px 22px;color:var(--mu)}
.empty-mark{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:#edf5f2;color:var(--ac);font-size:24px;margin:0 auto 13px}
.empty strong{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.detail-head{margin-bottom:20px}
.detail-title{font-size:25px}
.panel-title{font-weight:700;font-size:15px}
.helper{margin-top:5px;font-size:12px}
.tag.ok{background:#e3f3ec;color:#13805d}.tag.warn{background:#fdf0d9;color:#9a6200}.tag.bad{background:#fbe7e4;color:#c04c43}.tag.info{background:#e6eefb;color:#2c5fa8}
td input,td select{padding:7px 9px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111714;--card:#1b231f;--tx:#e8efeb;--mu:#9aa9a1;--bd:#303b35;--ac:#65b69b;--ac-dark:#4a9b80;--ok:#70d0a8;--bad:#ff8d80}
 .stat-icon,.device-icon,.empty-mark{background:#263a32;color:#80c8ad}
 button.ghost{background:#1b231f;color:var(--tx)}
 button.ghost:hover{background:#222e28;border-color:#496458;color:#9ad9c2}
 input,select{background:#151c18}
 label{color:#b4c0b9}
 .tag{background:#28322d;color:#c1cdc6}
 .stat:after{background:#65b69b0d}
 .tag.ok{background:#1f3a2e;color:#70d0a8}.tag.warn{background:#3a3120;color:#e8bf6a}.tag.bad{background:#3d2522;color:#ff8d80}.tag.info{background:#22304a;color:#8fb4ec}
}
@media(max-width:760px){main{padding:25px 18px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:15px}.stat{min-height:102px}.stat b{font-size:20px}}
@media(max-width:460px){main{padding:20px 14px 32px}header{margin-bottom:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px;min-height:96px}.stat b{font-size:18px}.stat-label{font-size:11px}.stat-icon{width:24px;height:24px}.intro h2{font-size:23px}.dev{padding:13px;gap:8px}.device-icon{flex-basis:36px;height:36px}.dev .sub{font-size:11px}.dev-value{font-size:14px}.row{gap:7px}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY='fixtrace:v1';
let db=load(),view={page:'list',id:null,adding:false,rep:false},tmp=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{devices:[]}}catch(e){return{devices:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const num=id=>parseFloat($('#'+id).value)||0;
const val=id=>$('#'+id).value.trim();
const dev=id=>db.devices.find(x=>x.id===id);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function addMonths(ds,m){
  m=+m||0;if(!ds||m<=0)return'';
  const d=new Date(ds+'T00:00:00');if(isNaN(d))return'';
  const day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()!==day)d.setDate(0);
  return iso(d);
}
function wStatus(end){
  if(!end)return{k:'none',t:'No warranty',s:''};
  const days=Math.ceil((new Date(end+'T23:59:59')-Date.now())/864e5);
  if(days<=0)return{k:'bad',t:'Expired on '+end,s:'Warranty expired'};
  const left=days===1?'expires today':days+' days left';
  return{k:days<=30?'warn':'ok',t:'Active · '+left+' (till '+end+')',s:'Warranty · '+(days===1?'ends today':days+'d left')};
}
const devExpiry=d=>addMonths(d.wStart||d.date,d.wMonths);
const partStatus=(r,p)=>wStatus(addMonths(r.date,p.warranty));
function activeParts(d){return d.repairs.reduce((a,r)=>a+r.parts.filter(p=>['ok','warn'].includes(partStatus(r,p).k)).length,0)}

function repCost(r){return(+r.labor||0)+r.parts.reduce((a,p)=>a+(+p.cost||0),0)}
function invested(d){return(+d.purchase||0)+d.repairs.reduce((a,r)=>a+repCost(r),0)}
function estimate(d){
  const yrs=d.date?Math.max(0,(Date.now()-new Date(d.date))/3.156e10):0;
  const base=+d.market>0?+d.market:+d.mrp>0?d.mrp*Math.pow(.78,yrs):+d.purchase||0;
  const cond={A:1,B:.9,C:.75,D:.55}[d.grade]||.9;
  const bat=d.battery&&d.battery<80?.95:1;
  let pen=1;
  d.repairs.forEach(r=>r.parts.forEach(p=>{pen*={OEM:.99,Aftermarket:.97,Unknown:.98}[p.quality]||.98}));
  return Math.round(base*cond*bat*pen);
}
function pl(n){return`<b class="${n>=0?'pos':'neg'}">${n>=0?'+':'−'}${inr(Math.abs(n))}</b>`}

function render(){
  const a=$('#app');
  if(view.page==='detail'){const d=db.devices.find(x=>x.id===view.id);if(d)return a.innerHTML=detail(d);view.page='list'}
  a.innerHTML=list();
}

function list(){
  const ds=db.devices,inv=ds.reduce((a,d)=>a+invested(d),0),est=ds.reduce((a,d)=>a+estimate(d),0);
  return`<header><div class="brand"><div class="brand-mark">↗</div><div><h1>Fix<span>Trace</span></h1><div class="sub">Device repair &amp; value tracker</div></div></div>
  <div class="row"><button onclick="view.adding=!view.adding;render()">＋ Add device</button>
  <button class="ghost" onclick="exportData()">Export data</button></div></header>
  <div class="intro"><div class="eyebrow">Overview</div><h2>Your device portfolio</h2><div class="sub">Track repairs, costs, and estimated resale value in one place.</div></div>
  <div class="grid">
   <div class="card stat"><span class="stat-label"><span class="stat-icon">▣</span>Devices tracked</span><b>${ds.length}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">↗</span>Total invested</span><b>${inr(inv)}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">◇</span>Est. resale value</span><b>${inr(est)}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">±</span>Projected profit/loss</span>${pl(est-inv)}</div></div>
  ${view.adding?addForm():''}
  <div class="section-head"><h2>Your devices</h2><span class="count">${ds.length} ${ds.length===1?'device':'devices'}</span></div>
  ${ds.length?ds.map(d=>`<div class="card dev" onclick="open_(${d.id})"><div class="dev-title"><span class="device-icon">${d.type==='laptop'?'▰':d.type==='tablet'?'▤':'▯'}</span><div><div class="dev-name">${esc(d.brand)} ${esc(d.model)}</div>
   <div class="sub">${esc(d.type)} · ${d.repairs.length} repair(s) · invested ${inr(invested(d))}${activeParts(d)?` · ${activeParts(d)} part ${activeParts(d)===1?'warranty':'warranties'} active`:''}</div></div></div>
   <div style="text-align:right">${(w=>w.s?`<span class="tag ${w.k}">${w.s}</span> `:'')(wStatus(devExpiry(d)))}<span class="tag">${esc(d.status)}</span><div class="dev-value">${inr(estimate(d))}</div></div></div>`).join('')
  :`<div class="card empty"><div class="empty-mark">▯</div><strong>No devices yet</strong><div>Add your first device to start tracking its repair history and value.</div><div style="margin-top:16px"><button class="ghost sm" onclick="sample()">Load sample data</button></div></div>`}`;
}

function addForm(){return`<div class="card" style="margin-bottom:22px"><div class="panel-title">Add a device</div><div class="sub">Enter the basic details to get started.</div><div class="form">
 <div><label>Type</label><select id="f_type"><option>phone</option><option>laptop</option><option>tablet</option></select></div>
 <div><label>Brand</label><input id="f_brand" placeholder="Samsung"></div>
 <div><label>Model</label><input id="f_model" placeholder="Galaxy S21"></div>
 <div><label>IMEI / Serial</label><input id="f_imei"></div>
 <div><label>Purchase price (₹)</label><input id="f_purchase" type="number"></div>
 <div><label>Launch price (₹)</label><input id="f_mrp" type="number"></div>
 <div><label>Purchase date</label><input id="f_date" type="date"></div>
 <div><label>Device warranty (months)</label><input id="f_warranty" type="number" min="0" placeholder="12"></div></div>
 <button onclick="addDevice()">Save device</button></div>`}

function addDevice(){
  if(!val('f_brand')||!val('f_model'))return alert('Brand and model are required.');
  db.devices.push({id:Date.now(),type:val('f_type'),brand:val('f_brand'),model:val('f_model'),imei:val('f_imei'),
   purchase:num('f_purchase'),mrp:num('f_mrp'),date:val('f_date'),wMonths:num('f_warranty'),wStart:'',grade:'B',battery:0,market:0,status:'in use',repairs:[]});
  save();view.adding=false;render();
}
function open_(id){view={page:'detail',id,adding:false,rep:false};tmp=[];render()}

function detail(d){
  const e=estimate(d),inv=invested(d);
  return`<header class="detail-head"><div class="brand"><div class="brand-mark">${d.type==='laptop'?'▰':d.type==='tablet'?'▤':'▯'}</div><div><div class="eyebrow">${esc(d.type)} details</div><h1 class="detail-title">${esc(d.brand)} ${esc(d.model)}</h1><div class="sub">${d.imei?'Serial / IMEI: '+esc(d.imei):'Repair history and valuation'}</div></div></div>
  <div class="row"><button class="ghost" onclick="view.page='list';render()">← Back</button>
  <button class="ghost" onclick="del(${d.id})">Delete</button></div></header>
  <div class="grid">
   <div class="card stat"><span class="stat-label"><span class="stat-icon">₹</span>Purchase</span><b>${inr(d.purchase)}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">⌁</span>Repair spend</span><b>${inr(inv-d.purchase)}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">◇</span>Est. resale</span><b>${inr(e)}</b></div>
   <div class="card stat"><span class="stat-label"><span class="stat-icon">±</span>Profit/loss</span>${pl(e-inv)}</div></div>
  <div class="card"><div class="panel-title">Condition &amp; valuation</div><div class="sub">Keep these details current for a more accurate estimate.</div><div class="form">
   <div><label>Condition grade</label><select onchange="upd(${d.id},'grade',this.value)">${['A','B','C','D'].map(g=>`<option ${d.grade===g?'selected':''}>${g}</option>`).join('')}</select></div>
   <div><label>Battery health %</label><input type="number" value="${d.battery||''}" onchange="upd(${d.id},'battery',+this.value)"></div>
   <div><label>Market price of similar (₹, optional)</label><input type="number" value="${d.market||''}" onchange="upd(${d.id},'market',+this.value)"></div>
   <div><label>Status</label><select onchange="upd(${d.id},'status',this.value)">${['in use','in repair','for sale','sold'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
   <div class="sub">Estimate = market price (or launch price depreciated ~22%/yr) × condition × battery factor × part-quality penalty.</div></div>
  ${warrantyCard(d)}
  <div class="section-head" style="margin-top:28px"><h2>Repair history</h2><span class="count">${d.repairs.length} ${d.repairs.length===1?'repair':'repairs'}</span></div>
  ${d.repairs.length?`<div class="card scroll"><table><tr><th>Date</th><th>Issue</th><th>Shop</th><th>Parts replaced</th><th>Cost</th><th></th></tr>
  ${d.repairs.map((r,i)=>`<tr><td>${esc(r.date)}</td><td>${esc(r.issue)}</td><td>${esc(r.shop)}</td>
   <td>${r.parts.map(p=>`${esc(p.name)} <span class="tag">${esc(p.quality)}</span>`).join(', ')||'—'}</td><td>${inr(repCost(r))}</td>
   <td><button class="ghost sm" onclick="delRep(${d.id},${i})">✕</button></td></tr>`).join('')}</table></div>`
  :`<div class="card empty"><div class="empty-mark">⌁</div><strong>No repairs recorded</strong><div>Repairs you add will appear here with their parts and costs.</div></div>`}
  <div style="margin-top:10px"><button onclick="view.rep=!view.rep;render()">+ Add repair</button></div>
  ${view.rep?repForm(d):''}
  ${partsSection(d)}`;
}

function warrantyCard(d){
  const exp=devExpiry(d),st=wStatus(exp);
  return`<div class="card" style="margin-top:14px"><div class="section-head" style="margin:0"><div><div class="panel-title">Device warranty</div><div class="sub">Manufacturer or seller warranty on the whole device.</div></div><span class="tag ${st.k}">${esc(st.t)}</span></div>
  <div class="form"><div><label>Warranty starts</label><input type="date" value="${esc(d.wStart||d.date||'')}" onchange="upd(${d.id},'wStart',this.value)"></div>
   <div><label>Period (months)</label><input type="number" min="0" value="${d.wMonths||''}" onchange="upd(${d.id},'wMonths',+this.value)"></div>
   <div><label>Expires on</label><div style="padding:10px 0;font-weight:650">${exp?esc(exp):'—'}</div></div></div>
  ${d.wMonths&&!exp?'<div class="sub helper">Set a warranty start date (or a purchase date) to calculate the expiry.</div>':''}</div>`;
}

function partsSection(d){
  const rows=[];d.repairs.forEach((r,ri)=>r.parts.forEach((p,pi)=>rows.push({r,ri,p,pi})));
  const head=`<div class="section-head" style="margin-top:28px"><h2>Parts &amp; warranty claims</h2><span class="count">${rows.length} ${rows.length===1?'part':'parts'}</span></div>`;
  if(!rows.length)return head+`<div class="card empty"><div class="empty-mark">⚙</div><strong>No replaced parts yet</strong><div>Parts you log in a repair show up here, where you can add serial numbers and file warranty claims.</div></div>`;
  return head+`<div class="card scroll"><table><tr><th>Part</th><th>Repaired on</th><th>Serial no.</th><th>Warranty</th><th>Claim</th></tr>
  ${rows.map(({r,ri,p,pi})=>{const st=partStatus(r,p),a=`${d.id},${ri},${pi}`;return`<tr>
   <td>${esc(p.name)} <span class="tag">${esc(p.quality)}</span></td>
   <td>${esc(r.date)}<div class="sub">${esc(r.shop)}</div></td>
   <td><input value="${esc(p.serial)}" placeholder="Add serial no." style="min-width:170px" onchange="setPart(${a},'serial',this.value.trim())"></td>
   <td><div class="row"><input type="number" min="0" value="${p.warranty||''}" placeholder="0" style="width:76px" onchange="setPart(${a},'warranty',+this.value)"><span class="sub">months</span></div><div style="margin-top:6px"><span class="tag ${st.k}">${esc(st.t)}</span></div></td>
   <td>${claimCell(a,p)}</td></tr>`}).join('')}</table></div>
  <div class="sub helper">Warranty runs from the repair date. Add the serial number printed on the replaced part: sellers usually ask for it, along with the invoice, to honour a claim.</div>`;
}
function claimCell(a,p){
  const c=p.claim;
  if(!c)return`<button class="ghost sm" onclick="claimPart(${a})">File claim</button>`;
  const cls={Filed:'info',Approved:'ok',Rejected:'bad'}[c.status]||'info';
  return`<div class="row"><span class="tag ${cls}">${esc(c.status)} · ${esc(c.date)}</span>
   <select style="width:auto" onchange="setClaim(${a},this.value)">${['Filed','Approved','Rejected'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select>
   <button class="ghost sm" title="Remove claim" onclick="clearClaim(${a})">✕</button></div>${c.note?`<div class="sub">${esc(c.note)}</div>`:''}`;
}
function setPart(id,ri,pi,k,v){dev(id).repairs[ri].parts[pi][k]=v;save();render()}
function claimPart(id,ri,pi){
  const r=dev(id).repairs[ri],p=r.parts[pi],st=partStatus(r,p);
  if(!p.serial)return alert('Add the part’s serial number first. It is needed to claim warranty.');
  if(st.k==='none'&&!confirm('No warranty period is set for this part. File a claim anyway?'))return;
  if(st.k==='bad'&&!confirm('This part’s warranty has expired. File a claim anyway?'))return;
  const note=prompt('Claim note or ticket number (optional):','');
  if(note===null)return;
  p.claim={status:'Filed',date:iso(new Date()),note:note.trim()};
  save();render();
}
function setClaim(id,ri,pi,v){dev(id).repairs[ri].parts[pi].claim.status=v;save();render()}
function clearClaim(id,ri,pi){if(confirm('Remove this warranty claim?')){dev(id).repairs[ri].parts[pi].claim=null;save();render()}}

function repForm(d){return`<div class="card" style="margin-top:10px"><b>New repair</b><div class="form">
 <div><label>Date</label><input id="r_date" type="date" value="${iso(new Date())}"></div>
 <div><label>Issue</label><input id="r_issue" placeholder="Cracked screen"></div>
 <div><label>Shop / technician</label><input id="r_shop"></div>
 <div><label>Labor cost (₹)</label><input id="r_labor" type="number"></div></div>
 <label>Parts replaced</label>
 <div class="row" style="margin-bottom:8px"><input id="p_name" placeholder="Part (Display, Battery…)" style="flex:2;min-width:140px">
 <select id="p_q" style="flex:1;min-width:110px"><option>OEM</option><option>Aftermarket</option><option>Unknown</option></select>
 <input id="p_cost" type="number" placeholder="Cost ₹" style="flex:1;min-width:90px">
 <input id="p_serial" placeholder="Part serial no. (optional)" style="flex:2;min-width:150px"><input id="p_w" type="number" min="0" placeholder="Warranty (months)" style="flex:1;min-width:120px"><button class="ghost" onclick="addPart()">Add part</button></div>
 <div style="margin-bottom:10px">${tmp.map(p=>`<span class="tag">${esc(p.name)} · ${esc(p.quality)} · ${inr(p.cost)}${p.warranty?` · ${p.warranty} mo warranty`:''}${p.serial?` · S/N ${esc(p.serial)}`:''}</span> `).join('')}</div>
 <button onclick="saveRep(${d.id})">Save repair</button></div>`}

function addPart(){
  if(!val('p_name'))return;
  tmp.push({name:val('p_name'),quality:val('p_q'),cost:num('p_cost'),serial:val('p_serial'),warranty:num('p_w'),claim:null});
  const keep={d:val('r_date'),i:val('r_issue'),s:val('r_shop'),l:val('r_labor')};
  render();
  $('#r_date').value=keep.d;$('#r_issue').value=keep.i;$('#r_shop').value=keep.s;$('#r_labor').value=keep.l;
}
function saveRep(id){
  if(!val('r_issue'))return alert('Describe the issue.');
  const d=db.devices.find(x=>x.id===id);
  d.repairs.push({date:val('r_date'),issue:val('r_issue'),shop:val('r_shop'),labor:num('r_labor'),parts:tmp});
  tmp=[];view.rep=false;save();render();
}
function upd(id,k,v){db.devices.find(x=>x.id===id)[k]=v;save();render()}
function delRep(id,i){if(confirm('Delete this repair?')){db.devices.find(x=>x.id===id).repairs.splice(i,1);save();render()}}
function del(id){if(confirm('Delete this device and its history?')){db.devices=db.devices.filter(x=>x.id!==id);save();view.page='list';render()}}
function exportData(){
  const t=JSON.stringify(db,null,2);
  navigator.clipboard?.writeText(t).then(()=>alert('Data copied to clipboard as JSON.'),()=>prompt('Copy your data:',t));
}
function sample(){
  const rd=new Date();rd.setMonth(rd.getMonth()-2);
  db.devices.push({id:Date.now(),type:'phone',brand:'Samsung',model:'Galaxy S21',imei:'',purchase:28000,mrp:69999,date:'2024-03-10',wMonths:12,wStart:'',grade:'B',battery:88,market:0,status:'for sale',
   repairs:[{date:'2025-06-15',issue:'Cracked screen',shop:'City Mobile Care',labor:500,parts:[{name:'Display',quality:'OEM',cost:6500,serial:'DSP-21A-77302',warranty:3,claim:null}]},
            {date:iso(rd),issue:'Battery drain',shop:'City Mobile Care',labor:300,parts:[{name:'Battery',quality:'Aftermarket',cost:1800,serial:'BAT-8841-X',warranty:6,claim:null}]}]});
  save();render();
}
render();
</script>
